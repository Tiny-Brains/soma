# The two plugin crates, as one workspace: a single lock file, one release profile, and one target
# directory between them. Nothing above this directory is a cargo project, so the workspace root
# lives here rather than at the repository root.
[workspace]
members = ["tb-rating", "tb-pairing"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde_json = "1"
# Only the export shims need the SDK, and its generated component-model bindings do not build for
# the host -- so each crate takes it as a wasm-only dependency and puts the shim behind the same
# cfg. Everything else in both crates is host-testable.
orion-plugin-sdk = "1.7"

# opt-level "s" and a single codegen unit keep the component small; the package is loaded over the
# admin API base64-encoded, so its size is a deploy cost.
[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
