# tb.rating -- the TrueSkill update, and the only arithmetic in TinyBrains that writes a ladder.
#
# `./build.sh` rebuilds the component beside this manifest, running the host tests first; both it
# and the plugin.json generated from this file are build output, never committed: the image builds
# them. Count calls this once per finished match, between reading the seats' priors (count's
# `priors` statement) and writing the fold. src/lib.rs documents the input and output.
abi = "orion:plugin@1.0.0"
name = "tb.rating"
version = "0.1.0"
component = "tb-rating.wasm"

[[functions]]
name = "tb.rating.trueskill"
description = "One TrueSkill update per ladder a match feeds, over its seats' priors, by rank"
category = "transform"

# The priors document count's `priors` statement builds. An expression, because the workflow points
# it at whatever the read task wrote rather than restating its shape.
#
# The output is the fold statement's fourth parameter exactly, so the task passes it straight on
# and the statement's length check (seat_count * cardinality(ladders)) is the second opinion on
# the arithmetic's shape.
[[functions.input_fields]]
name = "match"
description = "The priors document: ladders, seat_count, and per seat its rank and ratings"
kind = "object"
required = true
template_at = true

# The three TrueSkill parameters, passed rather than compiled in: they are policy (the season's
# `rating` rules, else [vars]). None is defaulted -- a missing one is a refusal, because defaulting would
# silently rate a whole ladder on numbers nobody chose.
[[functions.input_fields]]
name = "beta"
description = "Performance noise: how far one match's outcome may sit from true skill"
kind = "number"
required = true
template_at = true

[[functions.input_fields]]
name = "tau"
description = "The dynamics factor added to every prior variance, which re-opens a settled rating"
kind = "number"
required = true
template_at = true

[[functions.input_fields]]
name = "draw_probability"
description = "How often a draw is expected, which sets the margin within which one is called"
kind = "number"
required = true
template_at = true
